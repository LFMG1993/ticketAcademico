services:
  app:
    build: .
    container_name: ticketflow_app
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./data:/var/www/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ticketnet

  redis:
    image: redis:7-alpine
    container_name: ticketflow_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ticketnet

networks:
  ticketnet:
    driver: bridge

volumes:
  redis_data:
